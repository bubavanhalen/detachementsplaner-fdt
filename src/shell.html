<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Detachementsplaner · Einrückung & PISA</title>
  <!--STYLES-->
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt</a>
  <aside class="sidebar">
    <a class="brand" href="#" data-nav="home"><span class="brand-mark">d.</span><span>Detachementsplaner<small>EINRÜCKUNG & PISA</small></span></a>
    <button class="service-switch" data-nav="files"><span class="eyebrow">AKTUELLE DIENSTLEISTUNG</span><b id="serviceName">Neue Dienstleistung</b><span id="serviceDates">Noch nicht eingerichtet</span><span class="switch-label">Projekt & Ablage <span>↗</span></span></button>
    <div class="nav-label">ARBEITSBEREICH</div>
    <nav id="navigation" aria-label="Hauptnavigation">
      <button data-nav="groups"><span class="nav-icon">1</span>Detachemente planen<span id="navGroups" class="nav-count">0</span></button>
      <button data-nav="orders"><span class="nav-icon">2</span>Marschbefehle zuordnen</button>
      <button data-nav="details"><span class="nav-icon">3</span>Angaben ergänzen</button>
      <button data-nav="pisa"><span class="nav-icon">4</span>In PISA übernehmen<span id="navPisa" class="nav-count">0</span></button>
    </nav>
    <div class="nav-label">VERWALTEN</div>
    <nav aria-label="Projektverwaltung"><button data-nav="persons"><span class="nav-icon">◉</span>Personen nachschlagen<span id="navPeople" class="nav-count">0</span></button><button data-nav="contacts"><span class="nav-icon">☷</span>Google-Kontakte</button><button data-nav="sources"><span class="nav-icon">↓</span>Datenquellen</button><button data-nav="files"><span class="nav-icon">▤</span>Projekte & Archiv</button></nav>
    <div class="sidebar-bottom"><span class="local-dot"></span><span>Auf diesem Gerät<small id="saveState">Bereit</small></span><button class="icon-button" data-action="save-file" title="Projektdatei sichern" aria-label="Projektdatei sichern">↓</button></div>
  </aside>
  <div class="app">
    <header class="topbar">
      <span id="breadcrumb">Übersicht</span>
      <div class="global-search"><span aria-hidden="true">⌕</span><input id="globalSearch" type="search" aria-label="Person im aktuellen Projekt suchen" placeholder="Person, Versicherten-Nr. oder EC suchen…" autocomplete="off"><kbd>/</kbd></div>
      <span class="mode-badge" id="modeBadge">In Vorbereitung</span>
      <button class="button small" data-action="save-file">Projekt sichern</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>Lokale Vorbereitung · PISA bleibt das führende System</span><span>PAT · 12.02.2026</span></footer>
  </div>
  <dialog id="dlg" aria-labelledby="dlgH"><div class="dialog-head"><h2 id="dlgH"></h2><button class="icon-button" id="closeDialog" aria-label="Dialog schliessen">×</button></div><div id="dlgB"></div><div class="dialog-actions" id="dlgF"></div></dialog>
  <input type="file" id="fileHidden" hidden>
  <div id="liveMessage" class="sr-only" aria-live="polite"></div>
  <!--SCRIPTS-->
  <!--BOOT-->
</body>
</html>
